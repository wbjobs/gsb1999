<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 编辑器 · 解析 / 预览 / 同步 / 导出</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toolbar">
    <span class="title">Markdown 编辑器</span>
    <button id="export-html" type="button">导出 HTML</button>
    <button id="export-md" type="button">导出 Markdown</button>
    <button id="export-png" type="button">导出 PNG</button>
    <label><input type="checkbox" id="sync-toggle" checked> 同步滚动</label>
  </div>

  <div id="main">
    <div class="pane" id="editor-pane">
      <div class="pane-header">编辑</div>
      <textarea id="editor" spellcheck="false" placeholder="在此输入 Markdown..."></textarea>
    </div>
    <div class="pane" id="preview-pane">
      <div class="pane-header">预览（Canvas 渲染）</div>
      <div id="preview-wrap">
        <div id="preview-scroll">
          <div id="preview-spacer"></div>
        </div>
        <canvas id="preview-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="status">就绪</div>
  <div id="toast" role="alert"></div>

  <script src="js/parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
